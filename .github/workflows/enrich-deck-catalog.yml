name: Enrich deck catalog

on:
  workflow_dispatch:
    inputs:
      deck_id:
        description: "Deck ID opcional, por ejemplo chepe--jin-sakai"
        required: false
        type: string
      overwrite:
        description: "Sobrescribir official_name/commander_name existentes"
        required: false
        type: boolean
        default: false
      strict:
        description: "Fallar si Moxfield no responde para algún deck"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare branch
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH="enrich-deck-catalog-${RUN_ID}"
          git fetch origin main
          git switch -C "$BRANCH" origin/main

      - name: Enrich catalog
        shell: bash
        env:
          DECK_ID: ${{ inputs.deck_id }}
          OVERWRITE: ${{ inputs.overwrite }}
          STRICT: ${{ inputs.strict }}
        run: |
          ARGS=()
          if [ -n "$DECK_ID" ]; then
            ARGS+=(--deck-id "$DECK_ID")
          fi
          if [ "$OVERWRITE" = "true" ]; then
            ARGS+=(--overwrite)
          fi
          if [ "$STRICT" = "true" ]; then
            ARGS+=(--strict)
          fi

          python scripts/enrich_deck_catalog.py "${ARGS[@]}"
          python scripts/rebuild_exports.py
          python scripts/validate_data.py

      - name: Create pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH="enrich-deck-catalog-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deck_catalog.csv data/game_players.csv data/summary.json

          if git diff --cached --quiet; then
            echo "No catalog enrichment changes."
            exit 0
          fi

          git commit -m "Enrich deck catalog from Moxfield"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "Enrich deck catalog from Moxfield" \
            --body "Updates deck catalog metadata from Moxfield links and validates derived data."
